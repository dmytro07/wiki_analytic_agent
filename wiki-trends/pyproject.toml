[project]
name = "wiki-trends"
version = "0.1.0"
description = "Wikipedia pageview trend analysis for an AI-agent skill"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.scripts]
wiki-trends = "wiki_trends.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pypdf>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_trends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
markers = ["live: hits the real Wikimedia APIs (deselected by default)"]
addopts = "-m 'not live'"
